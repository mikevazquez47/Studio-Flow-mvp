name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format diagnostic
        run: |
          npx prettier --write "src/app/admin/(protected)/instructores/page.tsx" src/application/instructors/instructor-actions.ts
          git diff -- "src/app/admin/(protected)/instructores/page.tsx" src/application/instructors/instructor-actions.ts
          exit 1

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration scaffold
        run: npm run test:integration

      - name: Build
        run: npm run build
