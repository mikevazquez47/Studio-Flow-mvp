name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate canonical format
        run: |
          npx prettier --write \
            'src/app/admin/(protected)/agenda/page.tsx' \
            'src/app/admin/(protected)/page.tsx' \
            'src/app/globals.css' \
            'src/application/schedule/admin-schedule.ts'
          mkdir -p formatted/src/app/admin/'(protected)'/agenda
          mkdir -p formatted/src/application/schedule
          cp 'src/app/admin/(protected)/agenda/page.tsx' formatted/src/app/admin/'(protected)'/agenda/page.tsx
          cp 'src/app/admin/(protected)/page.tsx' formatted/src/app/admin/'(protected)'/page.tsx
          cp src/app/globals.css formatted/src/app/globals.css
          cp src/application/schedule/admin-schedule.ts formatted/src/application/schedule/admin-schedule.ts

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: prettier-output
          path: formatted
          retention-days: 1

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration scaffold
        run: npm run test:integration

      - name: Build
        run: npm run build
